- id: src_sat_customer
  type: source
  params:
    format: csv
    path: ../data/customers.csv
- id: stg_sat_customer
  type: sql
  inputs: [src_sat_customer]
  params:
    query: SELECT DISTINCT CAST(MD5(COALESCE(UPPER(TRIM(CAST(id AS VARCHAR))), '')) AS CHAR(32)) AS customer_hk,
      CAST(${load_ts} AS TIMESTAMP) AS load_dts, CAST(MD5(COALESCE(UPPER(TRIM(CAST(first_name AS VARCHAR))),
      '') || '||' || COALESCE(UPPER(TRIM(CAST(last_name AS VARCHAR))), '') || '||' || COALESCE(UPPER(TRIM(CAST(email
      AS VARCHAR))), '') || '||' || COALESCE(UPPER(TRIM(CAST(region AS VARCHAR))), '') || '||' || COALESCE(UPPER(TRIM(CAST(signup_date
      AS VARCHAR))), '')) AS CHAR(32)) AS hashdiff, CAST(first_name AS VARCHAR) AS first_name, CAST(last_name
