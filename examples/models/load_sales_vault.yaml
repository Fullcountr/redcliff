- id: stg_lnk_order_customer
  type: sql
  inputs: [src_lnk_order_customer]
  params:
    query: SELECT DISTINCT CAST(MD5(COALESCE(UPPER(TRIM(CAST(order_id AS VARCHAR))), '') || '||' || COALESCE(UPPER(TRIM(CAST(customer_id
      AS VARCHAR))), '')) AS CHAR(32)) AS order_customer_hk, CAST(MD5(COALESCE(UPPER(TRIM(CAST(order_id
