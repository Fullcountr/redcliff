# Generated by Redcliff from sales.yaml: edit the model, then generate again.
version: 0
name: load_sales
description: Loads the sales model. Generated by Redcliff from the model; edit the model, not this file.
variables:
  load_ts: CURRENT_TIMESTAMP
nodes:
- id: src_dim_customer
  type: source
  params:
    format: csv
    path: ../data/customers.csv
    columns:
      id: BIGINT
      first_name: VARCHAR
      last_name: VARCHAR
      email: VARCHAR
      region: VARCHAR
      signup_date: DATE
- id: stg_dim_customer
  type: sql
  inputs: [src_dim_customer]
  params:
    query: SELECT CAST(id AS BIGINT) AS customer_id, CAST(first_name AS VARCHAR) AS first_name, CAST(last_name
      AS VARCHAR) AS last_name, CAST(LOWER(TRIM(email)) AS VARCHAR) AS email, CAST(region AS VARCHAR)
      AS region, CAST(signup_date AS DATE) AS signup_date FROM src_dim_customer
  expect:
  - not_null: customer_id
  - unique: customer_id
- id: dim_customer
  type: target
  inputs: [stg_dim_customer]
  params:
    format: table
    table: dim_customer
    mode: scd2
    keys: [customer_id]
    surrogate_key: customer_key
    unknown_member: true
    scd1: [first_name, last_name, email]
    as_of: ${load_ts}
- id: src_fct_orders
  type: source
  params:
    format: csv
    path: ../data/orders.csv
    columns:
      order_id: BIGINT
      customer_id: BIGINT
      order_date: DATE
      status: VARCHAR
      amount: DECIMAL(10, 2)
- id: stg_dim_date
  type: sql
  inputs: [src_fct_orders]
  params:
    query: SELECT DISTINCT CAST(YEAR(CAST(order_date AS DATE)) * 10000 + MONTH(CAST(order_date AS DATE))
      * 100 + DAY(CAST(order_date AS DATE)) AS INT) AS date_key, CAST(CAST(order_date AS DATE) AS DATE)
      AS calendar_date, CAST(YEAR(CAST(order_date AS DATE)) AS INT) AS year, CAST(QUARTER(CAST(order_date
      AS DATE)) AS INT) AS quarter, CAST(MONTH(CAST(order_date AS DATE)) AS INT) AS month, CAST(DAY(CAST(order_date
      AS DATE)) AS INT) AS day FROM src_fct_orders WHERE order_date IS NOT NULL
  expect:
  - not_null: calendar_date
  - unique: calendar_date
- id: dim_date
  type: target
  inputs: [stg_dim_date]
  params:
    format: table
    table: dim_date
    mode: scd1
    keys: [calendar_date]
    surrogate_key: date_key
    unknown_member: true
- id: stg_fct_orders
  type: sql
  inputs: [src_fct_orders]
  params:
    query: SELECT CAST(order_id AS BIGINT) AS order_id, CAST(customer_id AS BIGINT) AS customer_id, CAST(YEAR(order_date)
      * 10000 + MONTH(order_date) * 100 + DAY(order_date) AS INT) AS order_date_key, CAST(order_date AS
      DATE) AS order_date, CAST(status AS VARCHAR) AS status, CAST(amount AS DECIMAL(10, 2)) AS amount,
      CAST(customer_id AS BIGINT) AS lookup_customer_key FROM src_fct_orders
  expect:
  - not_null: order_id
  - unique: order_id
- id: lookup_customer_key
  type: source
  params:
    format: table
    table: dim_customer
    columns:
      customer_key: BIGINT
      customer_id: BIGINT
      first_name: VARCHAR
      last_name: VARCHAR
      email: VARCHAR
      region: VARCHAR
      signup_date: DATE
      valid_from: TIMESTAMP
      valid_to: TIMESTAMP
      is_current: BOOLEAN
- id: pit_customer_key
  type: sql
  inputs: [lookup_customer_key]
  params:
    query: SELECT customer_key, customer_id, first_name, last_name, email, region, signup_date, valid_from,
      valid_to, CASE WHEN valid_from = MIN(valid_from) OVER (PARTITION BY customer_id) THEN TIMESTAMP
      '1900-01-01 00:00:00' ELSE valid_from END AS pit_from FROM lookup_customer_key
- id: keyed_fct_orders
  type: sql
  inputs: [stg_fct_orders, pit_customer_key]
  params:
    query: SELECT f.order_id, COALESCE(d_customer_key.customer_key, -1) AS customer_key, f.customer_id,
      f.order_date_key, f.order_date, f.status, f.amount FROM stg_fct_orders AS f LEFT JOIN pit_customer_key
      AS d_customer_key ON d_customer_key.customer_id = f.lookup_customer_key AND f.order_date >= d_customer_key.pit_from
      AND (d_customer_key.valid_to IS NULL OR f.order_date < d_customer_key.valid_to)
- id: fct_orders
  type: target
  inputs: [keyed_fct_orders]
  params:
    format: table
    table: fct_orders
    mode: merge
    keys: [order_id]
