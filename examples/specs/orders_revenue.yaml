version: 0
name: orders_revenue
description: Shipped revenue by customer region.
nodes:
  - id: orders
    type: source
    params:
      format: csv
      path: ../data/orders.csv
      columns: {order_id: int, customer_id: int, order_date: date, status: text, amount: 'decimal(10,2)'}
    expect:
      - unique: order_id
      - not_null: customer_id
      - accepted_values: {column: status, values: [shipped, pending, cancelled]}

  - id: customers
    type: source
    params:
      format: csv
      path: ../data/customers.csv
      columns: {id: int, first_name: text, last_name: text, email: text, region: text, signup_date: date}

  - id: shipped
    type: filter
    inputs: [orders]
    params:
      condition: status = 'shipped'

  - id: orders_with_region
    type: join
    inputs: [shipped, customers]
    params:
      how: inner
      condition: shipped.customer_id = customers.id

  - id: revenue_by_region
    type: aggregate
    inputs: [orders_with_region]
    params:
      group_by: [region]
      measures:
        revenue: SUM(amount)
        order_count: COUNT(*)
    expect:
      - condition: revenue > 0
        name: revenue_is_positive
      - row_count: {min: 1}

  - id: out
    type: target
    inputs: [revenue_by_region]
    params:
      format: parquet
      path: out/revenue_by_region.parquet
