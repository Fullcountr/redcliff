name: Release

# Push a tag like v0.1.0 to publish the `redcliff` package to PyPI and make a GitHub release.
# PyPI trusted publishing: no token is stored here. On pypi.org, add a trusted publisher for
# this repository, workflow `release.yml` and environment `pypi` (see docs/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/redcliff/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but the package says $version"; exit 1; }
      - run: pip install -e ".[dev]" build twine ruff
      - run: ruff check .
      - run: pytest -q
      - run: python -m build && twine check dist/*
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/check && /tmp/check/bin/pip install "$(ls dist/*.whl)[cli]"
          /tmp/check/bin/redcliff --version
          /tmp/check/bin/redcliff test ../examples/specs/orders_revenue.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: core/dist/

  vsix:
    # The VS Code extension, versioned with the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: The tag matches the extension version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but vscode/package.json says $version"; exit 1; }
      - run: |
          cd web && npm ci && npm run build:vscode
          cd ../vscode && npm ci && npm test && npm run build && npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/redcliff.vsix

  pypi:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/redcliff/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  marketplace:
    # Publishes the extension when the repository has the tokens; skipped otherwise.
    # VSCE_PAT: an Azure DevOps token for the `fullcountr` publisher; OVSX_PAT: an Open VSX token.
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: .
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then npx --yes @vscode/vsce publish --packagePath redcliff.vsix -p "$VSCE_PAT"; else echo "no VSCE_PAT: skipping the VS Code Marketplace"; fi
          if [ -n "$OVSX_PAT" ]; then npx --yes ovsx publish redcliff.vsix -p "$OVSX_PAT"; else echo "no OVSX_PAT: skipping Open VSX"; fi
