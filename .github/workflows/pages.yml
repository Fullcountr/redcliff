name: Deploy playground

# Publishes the playground to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the app (precomputes the examples, so they're interactive before the engine loads)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pip install "./core[cli]"
          cd web && npm ci && npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Runs the browser test against the site people actually visit, not a local copy.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Browser end-to-end test on the live site
        working-directory: web/e2e
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          for i in $(seq 1 30); do curl -sf "$APP_URL" > /dev/null && break; sleep 5; done
          node playground.e2e.mjs
