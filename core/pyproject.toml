[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redcliff"
version = "0.0.1"
description = "Open-source visual pipelines with lineage built in. Legacy ETL in, clean Spark out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Pure-Python dependencies only: this package must also run in Pyodide.
dependencies = ["sqlglot>=30"]

[project.optional-dependencies]
# PyYAML is optional: JSON specs need nothing extra, and Pyodide ships PyYAML.
yaml = ["pyyaml>=6"]
cli = ["pyyaml>=6", "duckdb>=1.1"]
dev = ["pytest>=8", "duckdb>=1.1", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
redcliff = "redcliff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redcliff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
