[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redcliff"
dynamic = ["version"]
description = "Open-source visual pipelines with lineage built in. Legacy ETL in, clean Spark out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Harishwar Reddy Korpol" }]
keywords = ["etl", "data lineage", "spark", "pyspark", "dbt", "informatica", "powercenter", "migration", "duckdb",
            "openlineage", "data quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
# Pure-Python dependencies only: this package must also run in Pyodide.
dependencies = ["sqlglot>=30"]

[project.optional-dependencies]
# PyYAML is optional: JSON specs need nothing extra, and Pyodide ships PyYAML.
yaml = ["pyyaml>=6"]
# DuckDB runs previews, checks and traces; 1.4 added MERGE.
cli = ["pyyaml>=6", "duckdb>=1.4"]
dev = ["pytest>=8", "duckdb>=1.4", "pyyaml>=6", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/Fullcountr/redcliff"
Playground = "https://fullcountr.github.io/redcliff/"
Documentation = "https://github.com/Fullcountr/redcliff/tree/main/docs"
Issues = "https://github.com/Fullcountr/redcliff/issues"

[project.scripts]
redcliff = "redcliff.cli:main"

[tool.hatch.version]
path = "src/redcliff/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/redcliff"]

[tool.hatch.build.targets.sdist]
include = ["src/redcliff", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
